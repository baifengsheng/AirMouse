<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Master Keyboard</title>
    <link rel="icon" type="image/png" href="/static/keys.png">
    <style>
        /* 同样在 body 增加动态高度支持 */
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
        }

        /* 全屏按钮的基础样式 */
        .fs-btn-kb {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fs-btn-kb svg {
            fill: #444;
            width: 22px;
            height: 22px;
        }

        .fs-btn-kb:active {
            background: #222;
        }

        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
            outline: none;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            padding: 5px;
        }

        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            padding: 2px;
        }

        /* 输入区 */
        .input-section {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #111;
            gap: 8px;
            /* 间距 */
            width: 100%;
            /* 确保容器占满宽度 */
        }

        #text-input {
            flex: 1;
            /* 自动占据剩余空间 */
            min-width: 0;
            /* 关键：允许 input 缩小到比默认值更小 */
            height: 40px;
            background: #222;
            border: none;
            color: white;
            padding: 0 10px;
            border-radius: 6px;
        }

        .send-btn {
            flex-shrink: 0;
            padding: 0px;
            height: 40px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .send-btn2 {
            flex-shrink: 0;
            padding: 0 0px;
            height: 40px;
            background: #4e4e4e;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        /* 基础按钮 */
        button {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #eee;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            height: 100%;
            /* 让按钮随行高自适应 */
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            transition: all 0.1s;
        }

        .keyboard-grid {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            flex: 1;
            /* 占据剩余所有垂直空间 */
        }

        .t9-panel {
            display: none;
            flex: 1;
            min-height: 0;
            width: 100%;
            flex-direction: column;
            gap: 5px;
        }

        .t9-native-entry {
            display: flex;
            width: 100%;
            height: 40px;
            flex: 0 0 40px;
            gap: 5px;
        }

        .t9-native-entry input {
            min-width: 0;
            flex: 1;
            padding: 0 10px;
            border: 1px solid #343438;
            border-radius: 5px;
            outline: none;
            background: #161618;
            color: #fff;
            font-size: 16px;
            user-select: text;
            -webkit-user-select: text;
        }

        .t9-native-entry input:focus {
            border-color: #007AFF;
        }

        .t9-native-entry button {
            width: 42px;
            min-width: 42px;
            height: 40px;
            min-height: 40px;
            background: #0067c8;
            font-size: 22px;
        }

        .t9-compose {
            min-height: 52px;
            padding: 3px 4px;
            border-bottom: 1px solid #222;
            overflow: hidden;
        }

        .t9-preedit {
            min-height: 22px;
            color: #fff;
            font-size: 15px;
            line-height: 22px;
            white-space: nowrap;
            overflow-x: auto;
        }

        .t9-pc-candidates {
            display: flex;
            gap: 3px;
            width: 100%;
            height: 28px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .t9-pc-candidates::-webkit-scrollbar {
            display: none;
        }

        .t9-pc-candidates button {
            flex: 1 0 0;
            min-width: 30px;
            min-height: 28px;
            height: 28px;
            padding: 0 4px;
            background: #18181a;
            color: #aaa;
            font-size: 11px;
            white-space: nowrap;
        }

        .t9-pc-candidates.has-candidates button {
            flex: 0 0 auto;
            min-width: 62px;
            max-width: 150px;
            padding: 0 8px;
        }

        .t9-pc-candidates button[hidden] {
            display: none;
        }

        .t9-candidate-index {
            margin-right: 4px;
            color: #777;
            font-size: 9px;
        }

        .t9-candidate-text {
            overflow: hidden;
            text-overflow: ellipsis;
            color: #f3f3f3;
            font-size: 14px;
        }

        .t9-pad {
            display: none;
            grid-template-columns: minmax(54px, 0.78fr) repeat(3, minmax(0, 1fr)) minmax(54px, 0.78fr);
            grid-template-rows: repeat(4, minmax(43px, 1fr));
            gap: 3px;
            flex: 1;
            min-height: 0;
        }

        .t9-panel[data-mode="pinyin"] .t9-pinyin-pad,
        .t9-panel[data-mode="number"] .t9-number-pad,
        .t9-panel[data-mode="symbol"] .t9-symbol-pad {
            display: grid;
        }

        .t9-panel:not([data-mode="pinyin"]) .t9-compose {
            display: none;
        }

        .t9-pinyin-pad {
            grid-template-areas:
                "choices split two three backspace"
                "choices four five six clear"
                "choices seven eight nine zero"
                "symbols numbers space language enter";
        }

        .t9-number-pad {
            grid-template-areas:
                "minus one two three backspace"
                "at four five six dot"
                "colon seven eight nine comma"
                "symbols pinyin zero space enter";
        }

        .t9-symbol-pad {
            grid-template-areas:
                "left-round right-round left-square right-square backspace"
                "plus minus equal slash backslash"
                "at hash currency percent ampersand"
                "pinyin numbers space question enter";
        }

        .t9-options {
            grid-area: choices;
            display: flex;
            min-width: 0;
            min-height: 0;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .t9-options::-webkit-scrollbar {
            display: none;
        }

        .t9-option {
            flex: 1 0 25%;
            min-width: 0;
            min-height: 40px;
            padding: 3px;
            border-radius: 0;
            border-width: 0 0 1px;
            background: #171719;
            color: #f2f2f2;
            font-size: 14px;
        }

        .t9-options.is-punctuation .t9-option {
            flex: 1;
            font-size: 20px;
        }

        .t9-option.active {
            background: #222226;
            color: #fff;
            border-color: #555;
        }

        .t9-key {
            position: relative;
            min-width: 0;
            min-height: 0;
            padding: 3px;
            flex-direction: column;
            gap: 2px;
            background: #3a3a3c;
            font-size: 17px;
            line-height: 1;
        }

        .t9-key-number {
            position: absolute;
            top: 4px;
            right: 5px;
            color: #9a9a9f;
            font-size: 9px;
            font-weight: 500;
        }

        .t9-key-label {
            color: #fff;
            font-size: 17px;
            font-weight: 500;
        }

        .t9-action {
            background: #171719;
            font-size: 16px;
        }

        .t9-mode-key {
            background: #171719;
            font-size: 14px;
        }

        .t9-space-key {
            background: #3a3a3c;
            font-size: 14px;
        }

        .t9-enter {
            background: #171719;
            font-size: 22px;
        }

        .row {
            display: flex;
            gap: 4px;
            width: 100%;
            flex: 1;
            /* 每一行平分垂直空间 */
        }


        /* 交互反馈 */
        button:active {
            background: #007AFF !important;
        }

        button.locked {
            background: #ff9500 !important;
            color: #000;
            border-color: #ff9500;
        }

        /* 键宽比例 */
        .k-f {
            color: #888;
            background: #0d0d0d;
        }


        .esc {
            flex: 0.8;
            color: #ff3b30;
        }

        .k-wide {
            flex: 1.5;
            background: #222;
        }

        .k-arrow {
            flex: 0.8;
            background: #4f4f4f;
        }

        .k-caps {
            flex: 1.6;
            background: #222;
            font-size: 9px;
        }

        .k-enter {
            flex: 2;
            background: #005bb5;
        }

        .k-shift {
            flex: 2;
        }

        .k-shift-r {
            flex: 0.85;
        }

        .k-space {
            flex: 7;
            background: #222;
        }



        /* 底部导航按钮 */
        .footer-nav {
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 5px 0;
            background: #000;
        }

        .nav-btn {
            background: #333;
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            flex: 0 1 auto;
            min-height: 36px;
        }

        .tablet-mode button {
            border-radius: 8px;
            font-size: 16px;
        }


        /* 手机竖屏使用九键，横屏保持原有全键盘 */
        @media screen and (orientation: portrait) {
            body {
                width: 100% !important;
                height: calc(var(--vh, 1vh) * 100) !important;
                position: static;
                transform: none !important;
                padding: 5px;
                overflow: hidden;
            }

            .container {
                max-width: 520px;
                transform: none !important;
            }

            .input-section {
                min-height: 46px;
                padding: 3px 6px;
            }

            .keyboard-grid {
                display: none;
            }

            .t9-panel {
                display: flex;
                flex: 0 0 clamp(292px, 36vh, 340px);
                margin-top: auto;
            }

            .footer-nav {
                padding: 3px 0;
            }

            body.native-input-active .t9-panel {
                flex-basis: 40px;
            }

            body.native-input-active .t9-compose,
            body.native-input-active .t9-pad {
                display: none !important;
            }
        }

        /* 非全屏下的缩放 */
        body.not-fs .container {
            transform: scale(0.9);
            transform-origin: top center;
        }
    </style>
</head>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/js/t9-pinyin.js"></script>
    <script>
        const socket = io();
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const feedback = () => {
            if (navigator.vibrate) navigator.vibrate(30);
            if (audioCtx) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }
        };
        const v = feedback;
        let locks = {
            ctrl: false, ctrl_r: false,
            win: false,
            alt: false, alt_r: false,
            shift: false, shift_r: false,
            caps: false
        };
        let rT, rI, lockTimer;
        let didLock = false;

        function hPS(norm, shft) { hP(locks.shift || locks.shift_r ? shft : norm); }

        function hP(key) {
            v();
            if (event.cancelable) event.preventDefault();
            sendKey(key);
            rT = setTimeout(() => { rI = setInterval(() => sendKey(key), 80); }, 500);
        }

        function hR() { clearTimeout(rT); clearInterval(rI); }

        // --- 特殊功能键核心逻辑 ---
        function hFuncStart(key) {
            v();
            if (event.cancelable) event.preventDefault();
            didLock = false;

            // 如果当前是锁定状态，点一下准备解锁
            if (locks[key]) {
                return;
            }

            // 正常按下
            socket.emit('key_action', { key: key, action: 'down' });

            // 开启长按计时
            lockTimer = setTimeout(() => {
                locks[key] = true;
                didLock = true;
                const btn = document.getElementById(key + '-key');
                if (btn) btn.classList.add('locked');
                if (key.includes('shift')) updateSymbols();
            }, 600);
        }

        function hFuncEnd(key) {
            clearTimeout(lockTimer);

            // 场景 A: 如果已经是锁定状态，这次是“轻点一下”来恢复
            if (locks[key] && !didLock) {
                locks[key] = false;
                const btn = document.getElementById(key + '-key');
                if (btn) btn.classList.remove('locked');
                socket.emit('key_action', { key: key, action: 'up' });
                if (key.includes('shift')) updateSymbols();
                return;
            }

            // 场景 B: 如果是短按（没触发长按锁定），松手即弹起
            if (!locks[key]) {
                socket.emit('key_action', { key: key, action: 'up' });
            }
        }

        function toggleLock(key) {
            v();
            locks[key] = !locks[key];
            const btn = document.getElementById(key + '-key');
            if (btn) btn.classList.toggle('locked', locks[key]);
            socket.emit('key_action', { key: key, action: locks[key] ? 'down' : 'up' });
        }

        function updateSymbols() {
            const isShift = locks.shift || locks.shift_r;
            document.querySelectorAll('.k-sym').forEach(btn => {
                btn.innerText = isShift ? btn.dataset.shft : btn.dataset.norm;
            });
        }

        function sendKeySequence(keys) {
            if (keys.length > 0) {
                socket.emit('key_sequence', { keys });
            }
        }

        function sendKey(key) {
            if (t9State.sentText) resetT9State();
            sendKeySequence([key]);
        }

        const t9State = {
            mode: 'pinyin',
            digits: '',
            options: [],
            optionIndex: 0,
            segments: [],
            sentText: ''
        };

        function t9CurrentOption() {
            return t9State.options[t9State.optionIndex] || null;
        }

        function queueT9Key(key) {
            sendKeySequence([key]);
        }

        function t9TargetText() {
            const current = t9CurrentOption();
            return t9State.segments.join('') + (current ? current.text : '');
        }

        function syncT9ToComputer() {
            const nextText = t9TargetText();
            const previousText = t9State.sentText;
            let commonLength = 0;

            while (
                commonLength < previousText.length &&
                commonLength < nextText.length &&
                previousText[commonLength] === nextText[commonLength]
            ) {
                commonLength++;
            }

            const keys = [];
            for (let index = commonLength; index < previousText.length; index++) {
                keys.push('backspace');
            }
            for (const letter of nextText.slice(commonLength)) {
                keys.push(letter);
            }
            sendKeySequence(keys);
            t9State.sentText = nextText;
        }

        function renderT9() {
            const current = t9CurrentOption();
            const preedit = [...t9State.segments];
            if (current) preedit.push(current.text);
            document.getElementById('t9-preedit').innerText = preedit.join("'");
            document.getElementById('t9-panel').dataset.mode = t9State.mode;

            const optionBox = document.getElementById('t9-options');
            optionBox.replaceChildren();
            optionBox.classList.toggle('is-punctuation', t9State.options.length === 0);

            if (t9State.options.length === 0) {
                [
                    { text: ',', key: ',' },
                    { text: '.', key: '.' },
                    { text: '?', key: '?' }
                ].forEach(item => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 't9-option';
                    button.innerText = item.text;
                    button.onclick = () => {
                        v();
                        t9DirectKey(item.key);
                    };
                    optionBox.appendChild(button);
                });
                return;
            }

            t9State.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 't9-option' + (index === t9State.optionIndex ? ' active' : '');
                button.innerText = option.text;
                button.onclick = () => {
                    v();
                    t9ChooseOption(index);
                };
                optionBox.appendChild(button);
            });
        }

        function setT9Digits(digits, preferredPrefix = '') {
            t9State.digits = digits;
            t9State.options = digits ? T9Pinyin.candidatesForDigits(digits, preferredPrefix) : [];
            t9State.optionIndex = 0;

            if (preferredPrefix) {
                const preferredIndex = t9State.options.findIndex(option => option.text.startsWith(preferredPrefix));
                if (preferredIndex >= 0) t9State.optionIndex = preferredIndex;
            }
        }

        function confirmT9Segment() {
            const current = t9CurrentOption();
            if (!current || !current.complete) return false;
            t9State.segments.push(current.text);
            setT9Digits('');
            renderT9();
            return true;
        }

        function t9PressDigit(digit) {
            const current = t9CurrentOption();
            const preferredPrefix = current ? current.text : '';
            let nextDigits = t9State.digits + digit;
            let nextOptions = T9Pinyin.candidatesForDigits(nextDigits, preferredPrefix);

            if (nextOptions.length === 0 && current && current.complete) {
                confirmT9Segment();
                nextDigits = digit;
                nextOptions = T9Pinyin.candidatesForDigits(nextDigits);
            }
            if (nextOptions.length === 0) return;

            setT9Digits(nextDigits, preferredPrefix);
            renderT9();
            syncT9ToComputer();
        }

        function t9ChooseOption(index) {
            if (!t9State.options[index]) return;
            t9State.optionIndex = index;
            renderT9();
            syncT9ToComputer();

            if (t9State.options[index].complete) {
                confirmT9Segment();
            }
        }

        function t9Split() {
            confirmT9Segment();
        }

        function t9Backspace() {
            const current = t9CurrentOption();
            if (t9State.digits.length > 0) {
                const nextDigits = t9State.digits.slice(0, -1);
                const preferredPrefix = current ? current.text.slice(0, -1) : '';
                setT9Digits(nextDigits, preferredPrefix);
                renderT9();
                syncT9ToComputer();
                return;
            }

            if (t9State.segments.length > 0) {
                t9State.segments.pop();
                renderT9();
                syncT9ToComputer();
                return;
            }

            queueT9Key('backspace');
        }

        function t9Clear() {
            sendKeySequence(Array(t9State.sentText.length).fill('backspace'));
            resetT9State();
        }

        function resetT9State() {
            t9State.digits = '';
            t9State.options = [];
            t9State.optionIndex = 0;
            t9State.segments = [];
            t9State.sentText = '';
            renderT9();
            document.getElementById('t9-options').scrollTop = 0;
        }

        function t9SelectPcCandidate(number) {
            queueT9Key(String(number));
            resetT9State();
            renderPcCandidates({ candidates: [] });
        }

        function t9DirectKey(key) {
            queueT9Key(key);
            resetT9State();
        }

        function t9SetMode(mode) {
            if (!['pinyin', 'number', 'symbol'].includes(mode) || mode === t9State.mode) return;
            if (t9State.sentText) {
                queueT9Key('space');
                resetT9State();
            }
            t9State.mode = mode;
            renderT9();
        }

        function t9ToggleLanguage() {
            if (t9State.sentText) {
                queueT9Key('space');
                resetT9State();
            }
            queueT9Key('shift');
        }

        function t9Space() {
            confirmT9Segment();
            queueT9Key('space');
            resetT9State();
        }

        function t9Enter() {
            confirmT9Segment();
            queueT9Key('enter');
            resetT9State();
        }

        function renderPcCandidates(payload = {}) {
            const candidateBox = document.getElementById('t9-pc-candidates');
            const candidates = Array.isArray(payload.candidates)
                ? payload.candidates.filter(candidate => typeof candidate === 'string' && candidate.trim()).slice(0, 9)
                : [];
            const buttons = [...candidateBox.querySelectorAll('button')];
            const hasCandidates = candidates.length > 0;

            candidateBox.classList.toggle('has-candidates', hasCandidates);
            buttons.forEach((button, index) => {
                const text = candidates[index] || '';
                button.hidden = hasCandidates && index >= candidates.length;
                button.querySelector('.t9-candidate-text').innerText = text;
                button.setAttribute(
                    'aria-label',
                    text ? (index + 1) + ' ' + text : '候选 ' + (index + 1)
                );
            });
        }

        socket.on('ime_candidates', renderPcCandidates);
        socket.on('connect', () => socket.emit('refresh_ime_candidates'));

        const nativeTextInput = document.getElementById('t9-native-input');
        let nativeInputComposing = false;

        function submitNativeText() {
            if (nativeInputComposing) {
                nativeTextInput.blur();
                setTimeout(submitNativeText, 30);
                return;
            }

            const text = nativeTextInput.value;
            if (!text) return;
            socket.emit('type_text', { text });
            nativeTextInput.value = '';
            setTimeout(() => nativeTextInput.focus({ preventScroll: true }), 0);
        }

        nativeTextInput.addEventListener('compositionstart', () => {
            nativeInputComposing = true;
        });
        nativeTextInput.addEventListener('compositionend', () => {
            nativeInputComposing = false;
        });
        nativeTextInput.addEventListener('keydown', event => {
            if (event.key === 'Enter' && !nativeInputComposing) {
                event.preventDefault();
                submitNativeText();
            }
        });
        nativeTextInput.addEventListener('focus', () => {
            document.body.classList.add('native-input-active');
        });
        nativeTextInput.addEventListener('blur', () => {
            document.body.classList.remove('native-input-active');
        });

        function goBack() {
            // 强制清除所有锁定状态
            for (let key in locks) {
                if (locks[key]) {
                    locks[key] = false;
                    const btn = document.getElementById(key + '-key');
                    if (btn) btn.classList.remove('locked');
                    socket.emit('key_action', { key: key, action: 'up' });
                }
            }
            updateSymbols(); // 恢复符号显示（如果 shift 被清除了）
            hR(); // 停止可能的重复按键

            // 稍微延时确保 socket 消息发出后再跳转
            setTimeout(() => {
                window.location.href = '/';
            }, 50);
        }

        function toggleTablet() {
            document.body.classList.toggle('tablet-mode');
            const isTablet = document.body.classList.contains('tablet-mode');
            document.getElementById('tablet-toggle').innerText = isTablet ? '普通模式' : '平板模式';
            localStorage.setItem('kb_tablet_mode', isTablet);
        }

        // 初始化平板模式
        if (localStorage.getItem('kb_tablet_mode') === 'true') {
            toggleTablet();
        }

        // 1. 动态高度补丁 (防止键盘弹出时遮挡或布局跳动)
        function resetHeight() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        window.addEventListener('resize', resetHeight);
        resetHeight();

        // 2. 全屏切换函数
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => {
                    console.log("Full screen failed");
                });
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // 3. 监听全屏状态改变图标和缩放类
        function updateFullscreenUI() {
            const iconPath = document.querySelector('#fs-icon-kb path');
            if (document.fullscreenElement) {
                document.body.classList.remove('not-fs');
                if (iconPath) iconPath.setAttribute('d', 'M14,14H19V16H16V19H14V14M5,14H10V19H8V16H5V14M8,5H10V10H5V8H8V5M19,8V10H14V5H16V8H19Z');
            } else {
